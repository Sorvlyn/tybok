# TyBoK CI: lint, the CLI surface guard, and the quick regression level.
#
# Design notes:
# - GitHub-hosted runners on a public repository are free and unlimited, and none of these jobs
#   needs a GPU. The `regression` job reports SKIP for every check that needs a checkpoint or a
#   GPU (see tests/README.md) -- on a bare runner that is the expected, passing outcome.
# - Triggers are `push` + `workflow_dispatch`: this repository is deployed from its default
#   branch, and leaving `pull_request` out means a fork cannot start a run. Add it back if you
#   begin reviewing pull requests.
# - No secrets, and nothing needs to write to the repository.
# - The action pins are the node24 majors (checkout v7 / setup-python v7): runners have defaulted
#   to node24 since 2026-06-16 and remove node20 on 2026-09-23, when the node20 majors (checkout
#   v4 / setup-python v5) stop running instead of just warning. node24 needs runner >= 2.327.1
#   (self-hosted only; the GitHub-hosted runners are fine).
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the run still in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so that a new ruff release cannot turn an unrelated push red. Keep in step with the
  # `[tool.ruff]` table in pyproject.toml (line-length / rules live there, not here).
  RUFF_VERSION: "0.16.8"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  cli:
    name: CLI surface guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No install step on purpose. The CLI and the backend registration are lazy precisely so
      # that this guard runs without numpy / torch / aiohttp; it must stay that way, and a
      # subcommand that starts importing the inference stack fails right here (the module
      # docstring of tests/cli/surface.py states the same contract).
      - name: python -m tybok without the inference stack
        run: |
          python -m tybok --help
          python -m tybok models
      - name: Pure-Python modules without the inference stack
        # Not only the CLI: fastwam's kernels/ tooling is pure stdlib (torch is imported inside
        # the functions that need it), it is documented as a standalone command
        # (docs/fastWAM_gemm_sweep.md), and the CPU-only `regression` job imports it through
        # tests/fastwam/sweep_geom.py. A backend package that eagerly imports its engine
        # (torch / triton) breaks all three, and this step is where that fails first.
        run: python -c "from tybok.policies.fastwam.kernels import geometry, phases, registry, sweep"
      - name: Surface guard
        run: python tests/cli/surface.py

  regression:
    name: regression (quick level)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: "Install (CPU-only torch: this runner has no GPU)"
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check -e ".[gateway]"
      # The `quick` level is the "did this change break the production configuration" gate;
      # `--level full` is the pre-release/CI-heavy variant (see tests/README.md). Checks whose
      # environment is missing (checkpoint, GPU) report SKIP and do not fail the run, so this
      # job is meaningful even with no checkpoints on the runner. To make them actually run,
      # put the checkpoints on the runner and export `TYBOK_CHECKPOINT_<MODEL>` (or provide
      # tests/checkpoints.env).
      - name: Regression
        run: python tests/run_tests.py --level quick
